<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Sneha Arts</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 class="site-title">Sneha Arts</h1>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h2>Contact</h2>
    <p>If you'd like to commission a portrait or inquire about prints, please reach out via email.</p>

    <form class="contact-form" action="mailto:sneha.pothuri@gmail.com" method="post" enctype="text/plain">
      <label>Name
        <input name="name" required>
      </label>
      <label>Email
        <input name="email" type="email" required>
      </label>
      <label>Message
        <textarea name="message" rows="6" required></textarea>
      </label>
      <button class="btn" type="submit">Send</button>
    </form>
    <p class="lede">Or email directly: <a href="mailto:sneha.pothuri@gmail.com">sneha.pothuri@gmail.com</a></p>
    <div class="socials" style="margin-top:1rem;">
      <a href="https://www.instagram.com/snehapothuri_art" target="_blank" rel="noopener"><i class="fab fa-instagram" aria-hidden="true"></i> @snehapothuri_art</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© Sneha Arts</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <!-- Canva About modal (embedded) -->
  <div id="canvaModal" class="canva-modal" aria-hidden="true">
    <div class="canva-modal__backdrop"></div>
    <div class="canva-modal__content" role="dialog" aria-modal="true">
      <button class="canva-close" aria-label="Close">×</button>
      <iframe id="canvaFrame" src="" loading="lazy" title="About Sneha"></iframe>
    </div>
  </div>
</body>
</html>
